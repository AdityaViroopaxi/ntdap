<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Profile & History — NTDAP v4</title>
  <link rel="stylesheet" href="/static/shared.css">
  <style>
    .page-wrap{max-width:1100px;margin:0 auto;padding:36px 24px 80px;position:relative;z-index:1}
    .profile-header{display:flex;align-items:center;gap:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:28px}
    .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;flex-shrink:0}
    .profile-info h2{font-size:20px;font-weight:800;margin-bottom:4px}
    .profile-info .email{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:'JetBrains Mono',monospace}
    .profile-meta{display:flex;gap:12px;flex-wrap:wrap}
    .pmeta{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:5px 11px;font-size:11px;color:var(--muted)}
    .pmeta strong{color:var(--text);font-weight:700}
    .badge-role{background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.35);color:#a78bfa;border-radius:100px;padding:4px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
    .stat-card .stat-value{font-size:28px;font-weight:900;font-family:'JetBrains Mono',monospace;color:var(--accent)}
    .stat-card .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .section-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
    .section-head h3::before{content:'';display:block;width:3px;height:18px;background:var(--accent);border-radius:2px}
    .filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .filter-row select,.filter-row input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-family:'Space Grotesk',sans-serif;font-size:13px;outline:none}
    .filter-row select:focus,.filter-row input:focus{border-color:var(--accent)}
    .history-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .history-table th{background:var(--surface2);border-bottom:1px solid var(--border);padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .history-table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
    .history-table tr:last-child td{border-bottom:none}
    .history-table tr:hover td{background:var(--surface2)}
    .sev-chip{display:inline-block;border-radius:100px;padding:3px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    .sev-NORMAL{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
    .sev-LOW{background:rgba(0,212,255,.12);color:#00d4ff;border:1px solid rgba(0,212,255,.3)}
    .sev-MEDIUM{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .sev-HIGH{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
    .sev-CRITICAL{background:rgba(255,59,59,.18);color:#ff3b3b;border:1px solid rgba(255,59,59,.4)}
    .threat-pills{display:flex;gap:5px;flex-wrap:wrap}
    .threat-pill{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#ef4444;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700}
    .fn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .view-btn{background:var(--surface2);border:1px solid var(--border);color:var(--accent);border-radius:7px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;transition:all .15s;font-family:'Space Grotesk',sans-serif}
    .view-btn:hover{background:rgba(0,212,255,.1);border-color:var(--accent)}
    .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-state .emoji{font-size:48px;margin-bottom:14px}
    .empty-state p{font-size:14px;margin-bottom:20px}
    .empty-state a{background:var(--accent);color:#000;padding:11px 24px;border-radius:9px;font-weight:700;text-decoration:none;font-size:14px}
    .loading{text-align:center;padding:48px;color:var(--muted);font-size:14px}
    .detail-modal{position:fixed;inset:0;background:rgba(3,7,18,.85);backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center;padding:24px}
    .detail-modal.open{display:flex}
    .detail-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:860px;width:100%;max-height:85vh;overflow-y:auto;padding:28px}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
    .modal-header h3{font-size:17px;font-weight:700}
    .close-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:color .2s}
    .close-btn:hover{color:var(--danger)}
    .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
    .detail-stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px}
    .detail-stat .ds-val{font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--accent)}
    .detail-stat .ds-lbl{font-size:11px;color:var(--muted);margin-top:2px}
    .alerts-list{display:flex;flex-direction:column;gap:8px}
    .alert-item{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:9px;padding:12px 15px;display:flex;gap:12px;align-items:flex-start}
    .alert-icon{font-size:18px;flex-shrink:0}
    .alert-type{font-size:12px;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
    .alert-detail{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
    .pkt-mini{overflow-x:auto;margin-top:16px}
    .pkt-mini table{width:100%;border-collapse:collapse;font-size:11px;font-family:'JetBrains Mono',monospace}
    .pkt-mini th{background:var(--surface2);padding:7px 10px;text-align:left;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border)}
    .pkt-mini td{padding:6px 10px;border-bottom:1px solid rgba(33,38,45,.5);color:var(--text)}
    .pkt-mini tr.anom td{color:var(--danger)}
    .sub-heading{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .open-full{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;border-radius:9px;padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;text-decoration:none;display:inline-block}
  </style>
</head>
<body>
<nav class="topnav" id="main-nav"></nav>

<div class="page-wrap">
  <!-- Profile Header -->
  <div class="profile-header" id="profile-header">
    <div class="avatar" id="avatar-initials">?</div>
    <div class="profile-info">
      <h2 id="profile-name">Loading…</h2>
      <div class="email" id="profile-email">—</div>
      <div class="profile-meta">
        <span class="pmeta">Joined: <strong id="profile-joined">—</strong></span>
        <span class="pmeta">Last login: <strong id="profile-last">—</strong></span>
        <span class="badge-role" id="profile-role">user</span>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="stats-row">
    <div class="stat-card"><div class="stat-value" id="st-total">—</div><div class="stat-label">Total Analyses</div></div>
    <div class="stat-card"><div class="stat-value" id="st-packets">—</div><div class="stat-label">Packets Analyzed</div></div>
    <div class="stat-card"><div class="stat-value" id="st-threats">—</div><div class="stat-label">Sessions w/ Threats</div></div>
    <div class="stat-card"><div class="stat-value" id="st-high">—</div><div class="stat-label">High/Critical</div></div>
  </div>

  <!-- History Table -->
  <div class="section-head">
    <h3>Analysis History</h3>
    <div class="filter-row">
      <input type="text" id="search-inp" placeholder="🔍 Filter by filename…" oninput="filterSessions()"/>
      <select id="sev-filter" onchange="filterSessions()">
        <option value="">All Severities</option>
        <option>NORMAL</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option>
      </select>
    </div>
  </div>

  <div id="history-area"><div class="loading">Loading your analyses…</div></div>
</div>

<!-- Detail Modal -->
<div class="detail-modal" id="detail-modal">
  <div class="detail-box">
    <div class="modal-header">
      <h3 id="modal-title">Session Detail</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/static/nav.js"></script>
<script>
const API = "";
let allSessions = [];

async function init() {
  const token = localStorage.getItem("ntdap_token");
  const userStr = localStorage.getItem("ntdap_user");
  if (!token || !userStr) { window.location.href = "login.html"; return; }
  const user = JSON.parse(userStr);

  if (user.role === "admin") {
    window.location.href = "admin.html";
    return;
}

  // Render nav
  document.getElementById("main-nav").outerHTML = renderNav("profile");

  // Populate profile
  document.getElementById("avatar-initials").textContent = (user.username || "?")[0].toUpperCase();
  document.getElementById("profile-name").textContent = user.username;
  document.getElementById("profile-email").textContent = user.email;
  document.getElementById("profile-role").textContent = user.role === "admin" ? "⚡ Admin" : "👤 Analyst";
  document.getElementById("profile-joined").textContent = user.created_at ? user.created_at.split("T")[0] : "—";
  document.getElementById("profile-last").textContent = user.last_login ? user.last_login.split("T")[0] : "First login";

  // Load history
  try {
    const res = await fetch(`${API}/history`, { headers: { "Authorization": `Bearer ${token}` } });
    if (res.status === 401) { window.location.href = "login.html"; return; }
    const data = await res.json();
    allSessions = data.history || [];
    renderStats(allSessions);
    renderTable(allSessions);
  } catch(e) {
    document.getElementById("history-area").innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p>Could not load history — is the backend running?</p></div>`;
  }
}

function renderStats(sessions) {
  const total = sessions.length;
  const packets = sessions.reduce((s,x) => s+(x.total_packets||0), 0);
  const threats = sessions.filter(x => x.severity && !["NORMAL","UNKNOWN"].includes(x.severity)).length;
  const high = sessions.filter(x => ["HIGH","CRITICAL"].includes(x.severity)).length;
  document.getElementById("st-total").textContent = total;
  document.getElementById("st-packets").textContent = packets.toLocaleString();
  document.getElementById("st-threats").textContent = threats;
  document.getElementById("st-high").textContent = high;
}

function renderTable(sessions) {
  const area = document.getElementById("history-area");
  if (!sessions.length) {
    area.innerHTML = `<div class="empty-state"><div class="emoji">📭</div><p>No analyses yet. Upload your first PCAP to get started.</p><a href="upload.html">Upload PCAP →</a></div>`;
    return;
  }
  const rows = sessions.map(s => {
    const threats = [];
    if (s.port_scan_detected) threats.push("PORT SCAN");
    if (s.syn_flood_detected)  threats.push("SYN FLOOD");
    if (s.beaconing_detected)  threats.push("BEACONING");
    if (s.dns_tunnel_detected) threats.push("DNS TUNNEL");
    const threatPills = threats.map(t => `<span class="threat-pill">${t}</span>`).join("") || '<span style="color:var(--muted);font-size:11px">None</span>';
    const date = s.uploaded_at ? new Date(s.uploaded_at).toLocaleString() : "—";
    const sev = s.severity || "UNKNOWN";
    return `<tr>
      <td><span class="fn" title="${s.filename}">📄 ${s.filename}</span></td>
      <td style="color:var(--muted);font-size:12px">${date}</td>
      <td><span class="sev-chip sev-${sev}">${sev}</span></td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:12px">${(s.total_packets||0).toLocaleString()}</td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:12px;color:${s.anomaly_percentage>10?"var(--danger)":"var(--text)"}">${(s.anomaly_percentage||0).toFixed(1)}%</td>
      <td><div class="threat-pills">${threatPills}</div></td>
      <td>
    <button class="view-btn" onclick="openPreviousAnalysis(${s.id})">
        Open Analysis →
    </button>
</td>
    </tr>`;
  }).join("");
  area.innerHTML = `<table class="history-table">
    <thead><tr>
      <th>File</th><th>Date</th><th>Severity</th><th>Packets</th><th>Anomalies</th><th>Threats</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function openPreviousAnalysis(sessionId) {
    const token = localStorage.getItem("ntdap_token");

    try {
        const res = await fetch(
            `${API}/history/${sessionId}/full`,
            {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        const data = await res.json();

        if (!res.ok) {
            alert(data.error || "Failed to load previous analysis");
            return;
        }

        sessionStorage.setItem(
            "ntdap_result",
            JSON.stringify(data)
        );

        window.location.href = "result_overview.html";

    } catch (error) {
        console.error(error);
        alert("Failed to open previous analysis");
    }
}


function filterSessions() {
  const q = document.getElementById("search-inp").value.toLowerCase();
  const sev = document.getElementById("sev-filter").value;

  const filtered = allSessions.filter(s =>
    (!q || (s.filename || "").toLowerCase().includes(q)) &&
    (!sev || s.severity === sev)
  );

  renderTable(filtered);
}

async function openDetail(sid) {
  const token = localStorage.getItem("ntdap_token");
  const modal = document.getElementById("detail-modal");
  const body  = document.getElementById("modal-body");
  body.innerHTML = "<div class='loading'>Loading session details…</div>";
  modal.classList.add("open");
  try {
    const res = await fetch(`${API}/history/${sid}`, { headers:{"Authorization":`Bearer ${token}`} });
    const data = await res.json();
    if (!res.ok) { body.innerHTML = `<p style="color:var(--danger)">${data.error}</p>`; return; }
    const s = data.session; const alerts = data.alerts || []; const pkts = data.packets || [];

    document.getElementById("modal-title").textContent = s.filename;

    const alertsHtml = alerts.length ? alerts.map(a => `
      <div class="alert-item">
        <span class="alert-icon">⚠️</span>
        <div><div class="alert-type">${a.alert_type}</div>
        <div class="alert-detail">${a.src_ip ? `src: ${a.src_ip}` : ""} ${a.dst_ip ? `→ ${a.dst_ip}` : ""}</div></div>
        <span class="sev-chip sev-${a.severity}" style="margin-left:auto">${a.severity}</span>
      </div>`).join("") : '<p style="color:var(--muted);font-size:13px">No threat alerts for this session.</p>';

    const pktRows = pkts.slice(0,20).map(p => `<tr class="${p.is_anomaly?"anom":""}">
      <td>${p.packet_number||"—"}</td><td>${p.protocol||"—"}</td>
      <td>${p.src_ip||"—"}:${p.src_port||"—"}</td>
      <td>${p.dst_ip||"—"}:${p.dst_port||"—"}</td>
      <td>${p.packet_length||"—"}</td>
      <td>${p.is_anomaly?"🔴 Yes":"✅ No"}</td>
    </tr>`).join("");

    const openUrl = `result_overview.html`;

    body.innerHTML = `
      <div class="detail-grid">
        <div class="detail-stat"><div class="ds-val">${(s.total_packets||0).toLocaleString()}</div><div class="ds-lbl">Total Packets</div></div>
        <div class="detail-stat"><div class="ds-val">${(s.anomaly_count||0).toLocaleString()}</div><div class="ds-lbl">Anomalies</div></div>
        <div class="detail-stat"><div class="ds-val">${(s.anomaly_percentage||0).toFixed(1)}%</div><div class="ds-lbl">Anomaly Rate</div></div>
        <div class="detail-stat"><div class="ds-val">${s.most_common_protocol||"—"}</div><div class="ds-lbl">Top Protocol</div></div>
        <div class="detail-stat"><div class="ds-val">${s.unique_src_ips||"—"}</div><div class="ds-lbl">Unique Src IPs</div></div>
        <div class="detail-stat"><div class="ds-val">${s.unique_flows||"—"}</div><div class="ds-lbl">Unique Flows</div></div>
      </div>
      <div style="margin-bottom:16px">
        <span class="sev-chip sev-${s.severity||'UNKNOWN'}" style="font-size:13px;padding:5px 14px">${s.severity||'UNKNOWN'}</span>
        <span style="color:var(--muted);font-size:12px;margin-left:10px">Analyzed: ${new Date(s.uploaded_at).toLocaleString()}</span>
      </div>
      <div class="sub-heading">🚨 Threat Alerts (${alerts.length})</div>
      <div class="alerts-list">${alertsHtml}</div>
      <div class="sub-heading">📦 Packet Sample (first 20)</div>
      <div class="pkt-mini"><table>
        <thead><tr><th>#</th><th>Protocol</th><th>Source</th><th>Destination</th><th>Length</th><th>Anomaly</th></tr></thead>
        <tbody>${pktRows}</tbody>
      </table></div>
    `;
  } catch(e) {
    body.innerHTML = `<p style="color:var(--danger)">Failed to load: ${e.message}</p>`;
  }
}

function closeModal() {
  document.getElementById("detail-modal").classList.remove("open");
}

document.getElementById("detail-modal").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

init();
</script>
</body>
</html>
