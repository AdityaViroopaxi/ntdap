<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Charts — NTDAP v4</title>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    /* ── Uniform 2-column grid ─────────────────────────── */
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .chart-card.wide { grid-column: 1 / -1; }
    @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }

    /* ── Card shell ────────────────────────────────────── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .2s, box-shadow .2s;
    }
    .chart-card:hover {
      border-color: rgba(0,212,255,.35);
      box-shadow: 0 0 24px rgba(0,212,255,.07);
    }

    /* ── Card header ───────────────────────────────────── */
    .card-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -.01em;
    }
    .card-badge {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 2px 8px;
    }

    /* ── Chart image ───────────────────────────────────── */
    .card-img-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 0;
    }
    .card-img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
    .card-error {
      padding: 40px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* ── Card footer / description ─────────────────────── */
    .card-desc {
      padding: 10px 18px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.6;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .card-save {
      flex-shrink: 0;
      font-size: 10.5px;
      color: var(--muted);
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 3px 10px;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .card-save:hover { color: var(--accent); border-color: rgba(0,212,255,.4); }

    /* ── Page meta ─────────────────────────────────────── */
    .chart-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,212,255,.07);
      border: 1px solid rgba(0,212,255,.18);
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 22px;
    }
  </style>
</head>
<body>
<div id="navMount"></div>
<div class="page-wrap" id="content">
  <div style="text-align:center;padding:80px;color:var(--muted)">Loading…</div>
</div>
<script src="nav.js"></script>
<script>
const token = localStorage.getItem("ntdap_token");

if (!token) {
    window.location.href = "login.html";
}

document.getElementById("navMount").innerHTML = renderNav("charts");

/* Chart metadata — heatmap permanently removed */
const CHART_META = {
  protocol_distribution: {
    title: "Protocol Distribution", type: "Donut + Bar", wide: true,
    desc: "Packet share per protocol alongside absolute counts. Unexpected protocols at high volume may indicate exfiltration or C2 traffic."
  },
  traffic_timeline: {
    title: "Traffic Volume Over Time", type: "Time Series", wide: true,
    desc: "Packets per interval over the full capture. Blue = all traffic, red dashed = anomalies. Sharp spikes may indicate floods or scans."
  },
  top_source_ips: {
    title: "Top Source IPs", type: "Horizontal Bar", wide: false,
    desc: "Most active sources by packet count and traffic volume. A single dominant IP scanning broadly is a strong red flag."
  },
  anomaly_scatter: {
    title: "Anomaly Scatter", type: "Scatter × 2", wide: false,
    desc: "Packet Size vs TTL and IAT vs Payload Ratio. Blue = normal, red triangles = ML-flagged anomalies."
  },
  flow_analysis: {
    title: "Flow Analysis", type: "Scatter + Bar", wide: false,
    desc: "Per-flow volume vs packet count on log scale, plus top 10 highest-volume flows by KB transferred."
  },
  packet_size: {
    title: "Packet Size Distribution", type: "Histogram", wide: false,
    desc: "Normal vs anomalous packet sizes with mean and p95 markers. Bimodal shape suggests mixed traffic types."
  },
  top_ports: {
    title: "Top Destination Ports", type: "Bar", wide: false,
    desc: "Most targeted ports. Red = suspicious (Meterpreter, IRC-C2). High RDP / SMB / Telnet counts are red flags."
  },
  tcp_flags: {
    title: "TCP Flag Distribution", type: "Bar", wide: false,
    desc: "Breakdown of TCP control flags. High RST = rejections or scans. High SYN without ACK = possible SYN flood."
  },
  inter_arrival: {
    title: "Inter-Arrival Time", type: "Histogram", wide: false,
    desc: "Time gap between consecutive packets. Very low IAT = automated traffic. Regular spikes = potential beaconing."
  },
};

function build(d) {
  const charts = d.charts || {};
  const count  = Object.keys(charts).length;

  let h = `
    <div class="page-header">
      <div class="file-badge">📄 ${d.filename}</div>
      <h1>Visualizations</h1>
      <p>Dark-themed analysis charts from NTDAP v4.0</p>
    </div>
    <div class="chart-count">📊 ${count} chart${count !== 1 ? "s" : ""} generated</div>`;

  if (count === 0) {
    h += `<div class="alert-card warn"><span class="alert-icon">⚠️</span>
      <div><div class="alert-title">No Charts Generated</div>
      <div class="alert-body">This can happen with very small captures (&lt;10 packets) or if the backend visualizer encountered an error.</div></div>
    </div>`;
  } else {
    /* Render in defined order: wide charts first, then half-width */
    const ORDER = Object.keys(CHART_META);
    const present = ORDER.filter(k => charts[k]);
    const extra   = Object.keys(charts).filter(k => !CHART_META[k]);
    const all     = [...present, ...extra];

    h += `<div class="chart-grid">`;
    all.forEach(key => {
      const url  = charts[key];
      const meta = CHART_META[key] || { title: key.replace(/_/g, " "), type: "Chart", wide: false, desc: "Network traffic visualization." };
      h += `
        <div class="chart-card${meta.wide ? " wide" : ""}">
          <div class="card-hdr">
            <span class="card-title">${meta.title}</span>
            <span class="card-badge">${meta.type}</span>
          </div>
          <div class="card-img-wrap">
            <img class="card-img" src="${url}" alt="${meta.title}" loading="lazy"
                 onerror="this.closest('.card-img-wrap').innerHTML='<div class=card-error>⚠ Chart could not be rendered</div>'"/>
          </div>
          <div class="card-desc">
            <span>${meta.desc}</span>
            <a class="card-save" href="${url}" download="${key}.png">⬇ Save</a>
          </div>
        </div>`;
    });
    h += `</div>`;
  }

  h += navRow("result_security.html", "← Security", "result_packets.html", "Packets →");
  document.getElementById("content").innerHTML = h;
}

const data = getResult();

if (data) {
    build(data);
} else {
    document.getElementById("content").innerHTML = `
        <div class="empty-state" style="text-align:center;padding:80px;">
            <h2>No analysis data found</h2>
            <p style="color:var(--muted);margin-top:10px;">
                Please upload and analyze a PCAP file first.
            </p>
            <br>
            <a href="upload.html"
               style="background:var(--accent);
                      color:#000;
                      padding:12px 25px;
                      border-radius:8px;
                      text-decoration:none;
                      font-weight:bold;">
               Upload PCAP →
            </a>
        </div>
    `;
}
</script>
</body>
</html>
