<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign In — NTDAP v4</title>
  <link rel="stylesheet" href="/static/shared.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .auth-wrap{width:100%;max-width:440px;position:relative;z-index:1}
    .auth-logo{text-align:center;margin-bottom:32px}
    .auth-logo .logo-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px}
    .auth-logo h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
    .auth-logo h1 span{color:var(--accent)}
    .auth-logo p{font-size:13px;color:var(--muted);margin-top:5px}
    .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
    .auth-tabs{display:flex;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:28px}
    .auth-tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);transition:all .2s;border:none;background:transparent;font-family:'Space Grotesk',sans-serif}
    .auth-tab.active{background:var(--surface3);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .form-panel{display:none}
    .form-panel.active{display:block}
    .field{margin-bottom:18px}
    .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
    .field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:14px;transition:border-color .2s;outline:none}
    .field input:focus{border-color:var(--accent)}
    .field input::placeholder{color:var(--muted)}
    .auth-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:all .2s;margin-top:4px}
    .auth-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,212,255,.25)}
    .auth-btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;transform:none;box-shadow:none}
    .err-msg{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.28);border-radius:9px;padding:11px 14px;font-size:13px;color:var(--danger);margin-bottom:16px;display:none;line-height:1.5}
    .ok-msg{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.28);border-radius:9px;padding:11px 14px;font-size:13px;color:var(--accent3);margin-bottom:16px;display:none}
    .divider{text-align:center;font-size:12px;color:var(--muted);margin:20px 0;position:relative}
    .divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border)}
    .divider::before{left:0}.divider::after{right:0}
    .demo-creds{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:13px 15px;font-size:12px;color:var(--muted);line-height:1.7}
    .demo-creds strong{color:var(--accent);font-family:'JetBrains Mono',monospace}
    .back-home{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s}
    .back-home:hover{color:var(--accent)}
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <div class="logo-icon">🔬</div>
    <h1>NT<span>DAP</span> v4</h1>
    <p>Network Traffic Anomaly Detection Platform</p>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Login -->
    <div class="form-panel active" id="panel-login">
      <div class="err-msg" id="login-err"></div>
      <div class="ok-msg"  id="login-ok"></div>
      <div class="field">
        <label>Username or Email</label>
        <input type="text" id="login-id" placeholder="admin or admin@ntdap.local" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="auth-btn" id="login-btn" onclick="doLogin()">Sign In →</button>
      <div class="divider">demo credentials</div>
      <div class="demo-creds">
        Admin: <strong>admin</strong> / <strong>admin123</strong><br>
        (Create additional accounts via Register tab)
      </div>
    </div>

    <!-- Register -->
    <div class="form-panel" id="panel-register">
      <div class="err-msg" id="reg-err"></div>
      <div class="ok-msg"  id="reg-ok"></div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="reg-user" placeholder="analyst_01" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@company.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password <span style="color:var(--muted);font-weight:400;text-transform:none">(min 6 chars)</span></label>
        <input type="password" id="reg-pw" placeholder="••••••••" autocomplete="new-password"/>
      </div>
      <button class="auth-btn" id="reg-btn" onclick="doRegister()">Create Account →</button>
    </div>
  </div>
  <a href="index.html" class="back-home">← Back to homepage</a>
</div>

<script>
const API_BASE = "";

// Switch between login/register tabs
function switchTab(tab) {
    document.querySelectorAll(".auth-tab").forEach(btn => {
        btn.classList.remove("active");
    });

    document.querySelectorAll(".form-panel").forEach(panel => {
        panel.classList.remove("active");
    });

    if (tab === "login") {
        document.querySelectorAll(".auth-tab")[0].classList.add("active");
        document.getElementById("panel-login").classList.add("active");
    } else {
        document.querySelectorAll(".auth-tab")[1].classList.add("active");
        document.getElementById("panel-register").classList.add("active");
    }

    clearMessages();
}

// Clear all messages
function clearMessages() {
    document.querySelectorAll(".err-msg").forEach(el => {
        el.style.display = "none";
        el.innerText = "";
    });

    document.querySelectorAll(".ok-msg").forEach(el => {
        el.style.display = "none";
        el.innerText = "";
    });
}

// Show error
function showError(id, message) {
    clearMessages();
    const box = document.getElementById(id);
    box.innerText = message;
    box.style.display = "block";
}

// Show success
function showSuccess(id, message) {
    clearMessages();
    const box = document.getElementById(id);
    box.innerText = message;
    box.style.display = "block";
}

// LOGIN FUNCTION
async function doLogin() {
    const username = document.getElementById("login-id").value.trim();
    const password = document.getElementById("login-pw").value.trim();

    if (!username || !password) {
        showError("login-err", "Please enter username/email and password");
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem("ntdap_token", data.token);
            localStorage.setItem("ntdap_user", JSON.stringify(data.user));

            showSuccess("login-ok", "Login successful! Redirecting...");

            setTimeout(() => {

    if (data.user.role === "admin") {
        window.location.href = "admin.html";
    } 
    else {
        window.location.href = "/upload-page";
    }

}, 1000);

        } else {
            showError("login-err", data.error || "Invalid credentials");
        }

    } catch (error) {
        console.error(error);
        showError("login-err", "Cannot reach backend. Is Flask running?");
    }
}

// REGISTER FUNCTION
async function doRegister() {
    const username = document.getElementById("reg-user").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-pw").value.trim();

    if (!username || !email || !password) {
        showError("reg-err", "Please fill all fields");
        return;
    }

    if (password.length < 6) {
        showError("reg-err", "Password must be at least 6 characters");
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/auth/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {
            showSuccess("reg-ok", "Registration successful! Please login.");

            document.getElementById("reg-user").value = "";
            document.getElementById("reg-email").value = "";
            document.getElementById("reg-pw").value = "";

            setTimeout(() => {
                switchTab("login");
            }, 1500);

        } else {
            showError("reg-err", data.error || "Registration failed");
        }

    } catch (error) {
        console.error(error);
        showError("reg-err", "Cannot connect to backend");
    }
}
</script>
</body>
</html>
