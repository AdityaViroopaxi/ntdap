<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Packets — NTDAP v4</title>
  <link rel="stylesheet" href="/static/shared.css">
  <style>
    .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
    .filter-input{background:var(--surface);border:1px solid var(--border);border-radius:8px;
      padding:7px 13px;font-size:12px;color:var(--text);font-family:'Space Grotesk',sans-serif;
      outline:none;transition:border-color .2s;min-width:180px}
    .filter-input:focus{border-color:var(--accent)}
    .filter-select{background:var(--surface);border:1px solid var(--border);border-radius:8px;
      padding:7px 13px;font-size:12px;color:var(--text);font-family:'Space Grotesk',sans-serif;
      outline:none;cursor:pointer}
    .filter-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
      padding:7px 14px;font-size:12px;color:var(--muted);cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .2s}
    .filter-btn.active{background:rgba(0,212,255,.1);border-color:var(--accent);color:var(--accent)}
    .pkt-count{font-size:12px;color:var(--muted);margin-left:auto}
    .anom-row td{background:rgba(239,68,68,.04) !important}
    .anom-row:hover td{background:rgba(239,68,68,.08) !important}
    #noResults{display:none;padding:40px;text-align:center;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
<div id="navMount"></div>
<div class="page-wrap" id="content">
  <div style="text-align:center;padding:80px;color:var(--muted)">Loading…</div>
</div>
<script src="/static/nav.js"></script>
<script>
const token = localStorage.getItem("ntdap_token");

if (!token) {
    window.location.href = "login.html";
}

document.getElementById("navMount").innerHTML = renderNav("packets");
const data = getResult();

if (data) {
    build(data);
} else {
    document.getElementById("content").innerHTML = `
        <div style="text-align:center;padding:80px;">
            <h2>No packet analysis data found</h2>
            <p style="color:var(--muted);margin-top:10px;">
                Please upload and analyze a PCAP file first.
            </p>
            <br>
            <a href="upload.html"
               style="
                   background:var(--accent);
                   color:#000;
                   padding:12px 25px;
                   border-radius:8px;
                   text-decoration:none;
                   font-weight:bold;
               ">
               Upload PCAP →
            </a>
        </div>
    `;
}

function build(d) {
  const sample = d.packet_sample || [];

  let h = `
    <div class="page-header">
      <div class="file-badge">📄 ${d.filename}</div>
      <h1>Packet Inspector</h1>
      <p>First ${sample.length} packets with live filter · Anomalous rows highlighted red</p>
    </div>`;

  if (!sample.length) {
    h += `<div class="alert-card warn"><span class="alert-icon">⚠️</span>
      <div class="alert-body">No packet sample data available.</div></div>`;
    document.getElementById("content").innerHTML = h;
    return;
  }

  // Get unique protocols for filter
  const protos = [...new Set(sample.map(p=>p.protocol||"OTHER"))].sort();

  h += `<div class="section-block">
    <div class="filter-bar">
      <input class="filter-input" id="fSearch" placeholder="🔍 Search IP / protocol / port…" oninput="applyFilters()"/>
      <select class="filter-select" id="fProto" onchange="applyFilters()">
        <option value="">All Protocols</option>
        ${protos.map(p=>`<option value="${p}">${p}</option>`).join("")}
      </select>
      <select class="filter-select" id="fType" onchange="applyFilters()">
        <option value="">All Types</option>
        <option value="DATA">DATA</option>
        <option value="HANDSHAKE">HANDSHAKE</option>
        <option value="RESET">RESET</option>
        <option value="DISCOVERY">DISCOVERY</option>
        <option value="CONTROL">CONTROL</option>
        <option value="TEARDOWN">TEARDOWN</option>
      </select>
      <button class="filter-btn" id="fAnomBtn" onclick="toggleAnomalyFilter()">⚠ Anomalies Only</button>
      <button class="filter-btn" onclick="clearFilters()">✕ Clear</button>
      <span class="pkt-count" id="pktCount">${sample.length} packets</span>
    </div>

    <div class="table-wrap">
      <table id="pktTable">
        <thead><tr>
          <th>#</th><th>Protocol</th><th>Type</th><th>Source IP</th><th>Src Port</th>
          <th>Destination IP</th><th>Dst Port</th><th>Size</th><th>TTL</th>
          <th>TCP Flags</th><th>Flow Pkts</th><th>DNS Query</th><th>HTTP</th><th>Anomaly</th>
        </tr></thead>
        <tbody id="pktBody"></tbody>
      </table>
      <div id="noResults">No packets match the current filter.</div>
    </div>
  </div>`;

  h += navRow("result_charts.html","← Charts","result_ai.html","AI Analyst →");
  document.getElementById("content").innerHTML = h;

  // Store all rows
  window._allPackets = sample;
  window._anomalyOnly = false;
  renderRows(sample);
}

function renderRows(rows) {
  const tbody = document.getElementById("pktBody");
  if (!rows.length) {
    tbody.innerHTML = "";
    document.getElementById("noResults").style.display = "block";
    document.getElementById("pktCount").textContent = "0 packets";
    return;
  }
  document.getElementById("noResults").style.display = "none";
  document.getElementById("pktCount").textContent = rows.length + " packets";

  tbody.innerHTML = rows.map(p => {
    const isAnom = p.is_anomaly == 1 || p.is_anomaly === true;
    const typeMap = {HANDSHAKE:"badge-blue",RESET:"badge-red",TEARDOWN:"badge-warn",DISCOVERY:"badge-purple",CONTROL:"badge-warn",DATA:"badge-gray",BROADCAST:"badge-gray"};
    return `<tr class="${isAnom?'anom-row':''}">
      <td class="td-dim">${p.packet_number||"—"}</td>
      <td>${protoBadge(p.protocol||"OTHER")}</td>
      <td>${p.packet_type?`<span class="badge ${typeMap[p.packet_type]||'badge-gray'}">${p.packet_type}</span>`:"—"}</td>
      <td class="mono">${p.src_ip||"—"}</td>
      <td class="mono td-dim">${p.src_port||"—"}</td>
      <td class="mono">${p.dst_ip||"—"}</td>
      <td class="mono text-accent">${p.dst_port||"—"}</td>
      <td class="mono">${p.packet_length||0} B</td>
      <td class="mono td-dim">${p.ttl||"—"}</td>
      <td class="mono td-dim" style="font-size:10px">${p.tcp_flags||"—"}</td>
      <td class="mono td-dim">${p.flow_packet_count||"—"}</td>
      <td class="mono td-dim" style="max-width:140px;overflow:hidden;text-overflow:ellipsis" title="${p.dns_query||""}">${p.dns_query||"—"}</td>
      <td class="mono td-dim">${p.http_method||"—"}</td>
      <td>${isAnom?'<span class="badge badge-red">⚠ ANOM</span>':'<span class="badge badge-green">OK</span>'}</td>
    </tr>`;
  }).join("");
}

function applyFilters() {
  const search = document.getElementById("fSearch").value.toLowerCase();
  const proto  = document.getElementById("fProto").value;
  const ptype  = document.getElementById("fType").value;
  let rows = window._allPackets;
  if (window._anomalyOnly) rows = rows.filter(p => p.is_anomaly==1 || p.is_anomaly===true);
  if (proto)  rows = rows.filter(p => (p.protocol||"") === proto);
  if (ptype)  rows = rows.filter(p => (p.packet_type||"") === ptype);
  if (search) rows = rows.filter(p =>
    JSON.stringify([p.src_ip,p.dst_ip,p.protocol,p.src_port,p.dst_port,p.dns_query,p.http_method])
      .toLowerCase().includes(search)
  );
  renderRows(rows);
}

function toggleAnomalyFilter() {
  window._anomalyOnly = !window._anomalyOnly;
  document.getElementById("fAnomBtn").classList.toggle("active", window._anomalyOnly);
  applyFilters();
}

function clearFilters() {
  document.getElementById("fSearch").value = "";
  document.getElementById("fProto").value = "";
  document.getElementById("fType").value = "";
  window._anomalyOnly = false;
  document.getElementById("fAnomBtn").classList.remove("active");
  applyFilters();
}
</script>
</body></html>
