<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Traffic Analysis — NTDAP</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"/>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    .proto-bars{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
    .proto-bar-row{display:grid;grid-template-columns:120px 1fr 90px;gap:12px;align-items:center;font-size:13px}
    .bar-track{background:var(--surface2);border-radius:100px;height:8px;overflow:hidden}
    .bar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width 1.2s ease}
    .proto-count{text-align:right;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px}
    .ip-enrich-badge{font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin-left:4px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:900px){.two-col{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="navMount"></div>
<div class="page-wrap" id="content">
  <div style="text-align:center;padding:80px;color:var(--muted)">Loading...</div>
</div>
<script src="nav.js"></script>
<script>
// ── Constants first (before any function calls) ──────────────────
const PORT_NAMES = {
  "80":"HTTP","443":"HTTPS","22":"SSH","21":"FTP","23":"TELNET","53":"DNS",
  "67":"DHCP","68":"DHCP","3306":"MySQL","5432":"PostgreSQL","6379":"Redis",
  "27017":"MongoDB","8080":"HTTP-Alt","8443":"HTTPS-Alt","25":"SMTP",
  "110":"POP3","143":"IMAP","587":"SMTP-TLS","993":"IMAPS","3389":"RDP",
  "5900":"VNC","161":"SNMP","123":"NTP","137":"NetBIOS","139":"NetBIOS",
  "445":"SMB","1433":"MSSQL","5060":"SIP","4500":"IPSEC","1194":"OpenVPN"
};

const HIGH_RISK_PORTS  = new Set(["23","21","137","138","139","445","3389","5900","23"]);
const SAFE_PORTS       = new Set(["443","22","53","123","80"]);

// ── Boot ─────────────────────────────────────────────────────────
document.getElementById("navMount").innerHTML = renderNav("traffic");
const data = getResult();
if (data) buildPage(data);

// ── Page builder ─────────────────────────────────────────────────
function buildPage(data) {
  const s      = data.statistics   || {};
  const total  = s.total_packets   || 1;
  const enrich = data.ip_enrichment || {};

  let html = `
    <div class="page-header">
      <div class="file-badge">📄 ${data.filename}</div>
      <h1>Traffic Analysis</h1>
      <p>Protocol distribution, IP addresses, ports and communication patterns</p>
    </div>`;

  // ── Stat cards ────────────────────────────────────────────────
  html += `<div class="stat-grid">
    ${statCard("Total Packets",   fmt(s.total_packets),               "accent")}
    ${statCard("Total Data",      fmtBytes(s.total_bytes),            "accent")}
    ${statCard("Capture Time",    (s.capture_duration_seconds||0)+" sec")}
    ${statCard("Rate",            (s.packets_per_second||0)+" pkt/s")}
    ${statCard("Unique Src IPs",  fmt(s.unique_src_ips))}
    ${statCard("Unique Dst IPs",  fmt(s.unique_dst_ips))}
    ${statCard("Avg Packet",      (s.avg_packet_size||0)+" B")}
    ${statCard("Avg IAT",         (s.avg_inter_arrival_ms||0)+" ms")}
  </div>`;

  // ── Protocol bars ─────────────────────────────────────────────
  html += `<div class="section-head">🌐 Protocol Distribution</div>`;
  const protos       = s.protocol_distribution || {};
  const sortedProtos = Object.entries(protos).sort((a,b)=>b[1]-a[1]);
  const maxProto     = (sortedProtos[0] && sortedProtos[0][1]) || 1;

  html += `<div class="proto-bars" id="protoBars">`;
  sortedProtos.forEach(([proto, count]) => {
    const pct  = ((count / total) * 100).toFixed(1);
    const barW = ((count / maxProto) * 100).toFixed(1);
    html += `<div class="proto-bar-row">
      <span><span class="badge blue">${proto}</span></span>
      <div class="bar-track"><div class="bar-fill" data-w="${barW}"></div></div>
      <span class="proto-count">${fmt(count)} (${pct}%)</span>
    </div>`;
  });
  html += `</div>`;

  // ── Two-column: top IPs ───────────────────────────────────────
  html += `<div class="two-col">`;

  // Source IPs
  html += `<div><div class="section-head">📤 Top Source IPs</div>
    <div class="table-wrap"><table>
      <tr><th>IP Address</th><th>Label</th><th>Packets</th><th>%</th></tr>`;
  Object.entries(s.top_source_ips || {}).forEach(([ip, count]) => {
    const pct   = ((count / total) * 100).toFixed(1);
    const label = (enrich[ip] && enrich[ip].label) || "External";
    html += `<tr>
      <td class="mono">${ip}</td>
      <td><span class="ip-enrich-badge">${label}</span></td>
      <td class="mono" style="color:var(--accent)">${fmt(count)}</td>
      <td class="mono" style="color:var(--muted)">${pct}%</td>
    </tr>`;
  });
  html += `</table></div></div>`;

  // Destination IPs
  html += `<div><div class="section-head">📥 Top Destination IPs</div>
    <div class="table-wrap"><table>
      <tr><th>IP Address</th><th>Packets</th><th>%</th></tr>`;
  Object.entries(s.top_destination_ips || {}).forEach(([ip, count]) => {
    const pct = ((count / total) * 100).toFixed(1);
    html += `<tr>
      <td class="mono">${ip}</td>
      <td class="mono" style="color:var(--accent)">${fmt(count)}</td>
      <td class="mono" style="color:var(--muted)">${pct}%</td>
    </tr>`;
  });
  html += `</table></div></div>`;
  html += `</div>`; // end two-col

  // ── Ports table ───────────────────────────────────────────────
  html += `<div class="section-head">🔌 Top Destination Ports</div>`;
  html += `<div class="table-wrap"><table>
    <tr><th>Port</th><th>Service</th><th>Packets</th><th>% of Total</th><th>Risk</th></tr>`;
  Object.entries(s.top_destination_ports || {}).forEach(([port, count]) => {
    const pct     = ((count / total) * 100).toFixed(1);
    const service = PORT_NAMES[port] || "Unknown";
    const isRisky = HIGH_RISK_PORTS.has(port);
    const isSafe  = SAFE_PORTS.has(port);
    const riskBadge = isRisky
      ? '<span class="badge red">High Risk</span>'
      : isSafe ? '<span class="badge green">Safe</span>'
      : '<span class="badge blue">Normal</span>';
    html += `<tr>
      <td class="mono" style="color:var(--accent)">${port}</td>
      <td><span class="badge ${isRisky?'red':isSafe?'green':'blue'}">${service}</span></td>
      <td class="mono">${fmt(count)}</td>
      <td class="mono" style="color:var(--muted)">${pct}%</td>
      <td>${riskBadge}</td>
    </tr>`;
  });
  html += `</table></div>`;

  // ── Communication pairs ───────────────────────────────────────
  if (s.top_pairs && s.top_pairs.length > 0) {
    html += `<div class="section-head">🔗 Top Communication Pairs</div>`;
    html += `<div class="table-wrap"><table>
      <tr><th>Source IP</th><th></th><th>Destination IP</th><th>Packets</th><th>Share</th></tr>`;
    s.top_pairs.forEach(p => {
      const pct = ((p.count / total) * 100).toFixed(1);
      html += `<tr>
        <td class="mono">${p.src}</td>
        <td style="color:var(--muted);text-align:center">→</td>
        <td class="mono">${p.dst}</td>
        <td class="mono" style="color:var(--accent)">${fmt(p.count)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;background:var(--surface2);border-radius:100px;height:6px;overflow:hidden;min-width:80px">
              <div style="height:100%;background:var(--accent);border-radius:100px;width:${Math.min(100,pct*5)}%"></div>
            </div>
            <span class="mono" style="color:var(--muted);font-size:11px">${pct}%</span>
          </div>
        </td>
      </tr>`;
    });
    html += `</table></div>`;
  }

  // ── Private vs Public ─────────────────────────────────────────
  if (s.private_ip_count != null) {
    const priv    = s.private_ip_count || 0;
    const pub_    = s.public_ip_count  || 0;
    const privPct = ((priv / (priv + pub_ || 1)) * 100).toFixed(1);
    html += `<div class="section-head">🏠 Network Type Breakdown</div>`;
    html += `<div class="stat-grid">
      ${statCard("Private / LAN Packets",   fmt(priv),  "green")}
      ${statCard("Public / Internet Packets", fmt(pub_), "accent")}
      ${statCard("LAN Traffic %",   privPct+"%")}
      ${statCard("Internet Traffic %", (100-parseFloat(privPct)).toFixed(1)+"%")}
    </div>`;
    if (data.interpretation && data.interpretation.network_type) {
      html += `<div class="alert info">
        <span class="alert-icon">ℹ️</span>
        <div>${data.interpretation.network_type}</div>
      </div>`;
    }
  }

  // ── Nav row ───────────────────────────────────────────────────
  html += navRow("result_overview.html","← Overview","result_security.html","Security →");

  document.getElementById("content").innerHTML = html;

  // Animate bars after paint
  requestAnimationFrame(() => {
    document.querySelectorAll(".bar-fill[data-w]").forEach(el => {
      el.style.width = el.getAttribute("data-w") + "%";
    });
  });
}

function statCard(label, value, cls) {
  return `<div class="stat-card ${cls||''}">
    <div class="stat-label">${label}</div>
    <div class="stat-value">${value}</div>
  </div>`;
}
function navRow(ph, pl, nh, nl) {
  return `<div style="display:flex;gap:12px;justify-content:space-between;margin-top:32px;border-top:1px solid var(--border);padding-top:24px">
    <a href="${ph}" style="border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none">${pl}</a>
    <a href="${nh}" style="background:var(--accent);color:#000;padding:10px 24px;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none">${nl}</a>
  </div>`;
}
</script>
</body>
</html>
